custom_profile_contract:
  schema_id: rtl-sim-review-full-inline-asic-profile-v1
  file_shape:
    exact_root_fields: [schema_version, profile]
    profile_container_key: profile
    unknown_root_fields_allowed: false
  required_schema_version:
    type: string
    exact_value: "1.0"
  whole_profile_replacement: true
  partial_profile_resolution_allowed: false
  allow_references: false
  allow_inheritance: false
  allow_yaml_merge_keys: false
  unknown_fields_allowed: false
  disallowed_profile_fields:
    - profile_defaults_ref
    - threshold_set
    - extends
    - resource_accounting
    - metric_accounting
    - machine_field_contract
    - period_validation
    - profile_expansion
    - custom_profile_contract
    - "$ref"
    - "<<"
  exact_profile_fields:
    - profile_id
    - selector
    - supported_period_bands
    - period_bands
    - period_band_thresholds
    - memory_policy
    - logic_complexity_points
    - non_signoff
    - source
    - calibration
  exact_mapping_fields:
    selector: [node_nm]
    period_band: [lower_bound_ns, lower_inclusive, upper_bound_ns, upper_inclusive]
    period_band_threshold: [pass_max]
    pass_max:
      - serial_op_nodes
      - serial_arithmetic_nodes
      - mux_max_inputs
      - mux_serial_levels
      - priority_max_entries
      - cam_parallel_entries
      - cam_compare_bits
      - fanout_nonclock_control_sinks
    memory_policy: [policy_id, generic_memory, cam]
    generic_memory:
      - applies_to_storage_kinds
      - excluded_storage_kinds
      - allowed_port_models
      - port_limits
      - minimum_read_latency_cycles
      - require_accesses_within_port_limits
      - require_explicit_collision_semantics
      - allow_same_cycle_dependent_secondary_lookup
      - known_fail_conditions
      - missing_observation_result
    port_limit:
      - max_reads_per_cycle
      - max_writes_per_cycle
      - max_total_accesses_per_cycle
    cam:
      - applies_to_storage_kinds
      - is_generic_memory_exception
      - generic_async_read_prohibition_applies
      - required_profile_thresholds
      - require_all_other_applicable_cone_thresholds
      - require_explicit_lookup_update_collision_semantics
      - require_accesses_within_declared_ports
      - allow_same_cycle_dependent_secondary_lookup
      - threshold_exceeded_result
      - missing_observation_result
    logic_complexity_points:
      - policy_id
      - unit
      - accumulation
      - fixed_wiring_points
      - timing_class_projection
      - rules
      - zero_point_operation_classes
      - zero_point_classification_width_bits
      - needs_input_conditions
    logic_rule: [rule_id, match, points]
    timing_class_projection_record: [operation_classes, allowed_timing_classes]
    logic_rule_match_required_fields: [operation_classes]
    logic_rule_match_allowed_range_fields:
      - classification_width_bits
      - max_operand_width_bits
    logic_width_range: [min_inclusive, max_inclusive]
    zero_point_classification_width_bits: [min_inclusive, max_inclusive]
    needs_input_conditions:
      - classification_width_bits_above
      - operation_classes
      - invalid_or_unknown_width
      - result
    non_signoff:
      - fixed
      - classification
      - threshold_authority
      - physical_fact
      - signoff_qualified
      - replaces_sta
      - replaces_physical_design
      - requires_library_pvt_parasitic_signoff
    source: [owner, document, revision, approval_basis]
    calibration:
      - method
      - evidence
      - pvt_assumptions
      - library_or_macro_assumptions
      - validated_on
  selector_contract:
    exact_fields: [node_nm]
    node_nm_type: positive_integer_not_boolean
    match_mode: exact
    fallback_allowed: false
    interpolation_allowed: false
  period_contract:
    required_period_bands: [tightest, tight, normal, relaxed]
    supported_period_bands_exact: [tightest, tight, normal, relaxed]
    custom_period_bands_must_exactly_equal_registry_period_bands: true
    period_normalization_owner: evaluator
    custom_period_validation_field_allowed: false
  threshold_contract:
    required_metrics:
      - serial_op_nodes
      - serial_arithmetic_nodes
      - mux_max_inputs
      - mux_serial_levels
      - priority_max_entries
      - cam_parallel_entries
      - cam_compare_bits
      - fanout_nonclock_control_sinks
    value_type: nonnegative_integer_not_boolean
    arbitrary_precision: true
  required_memory_policy_paths:
    - policy_id
    - generic_memory.applies_to_storage_kinds
    - generic_memory.excluded_storage_kinds
    - generic_memory.allowed_port_models
    - generic_memory.port_limits
    - generic_memory.minimum_read_latency_cycles
    - generic_memory.require_accesses_within_port_limits
    - generic_memory.require_explicit_collision_semantics
    - generic_memory.allow_same_cycle_dependent_secondary_lookup
    - generic_memory.known_fail_conditions
    - generic_memory.missing_observation_result
    - cam.applies_to_storage_kinds
    - cam.is_generic_memory_exception
    - cam.generic_async_read_prohibition_applies
    - cam.required_profile_thresholds
    - cam.require_all_other_applicable_cone_thresholds
    - cam.require_explicit_lookup_update_collision_semantics
    - cam.require_accesses_within_declared_ports
    - cam.allow_same_cycle_dependent_secondary_lookup
    - cam.threshold_exceeded_result
    - cam.missing_observation_result
  generic_port_models_contract:
    canonicalization_ref: machine_field_contract.generic_port_model_contract
    built_in_allowed_port_models_exact: [1RW, 1R1W]
    custom_allowed_port_models_type: unique_nonempty_canonical_model_id_list
    custom_may_add_models_such_as: [2R1W]
    port_limits_keys_must_exactly_equal_allowed_port_models: true
    port_limit_exact_fields:
      - max_reads_per_cycle
      - max_writes_per_cycle
      - max_total_accesses_per_cycle
    port_limit_field_type: nonnegative_integer_not_boolean
    minimum_read_latency_cycles_type: positive_integer_not_boolean
    require_fixed_generic_semantics_ref: machine_field_contract.generic_port_model_contract.fixed_generic_semantics
    additional_model_calibration:
      trigger: any_allowed_port_model_not_in_built_in_allowed_port_models_exact
      require_calibration_method: true
      require_calibration_evidence_covering_each_additional_model: true
      require_explicit_pvt_assumptions: true
      require_library_or_macro_assumptions_covering_each_additional_model: true
      generic_or_no_macro_assumption_is_sufficient: false
      strict_calibration_support_contract_ref: custom_profile_contract.strict_calibration_support_contract
  required_logic_complexity_paths:
    - policy_id
    - unit
    - accumulation
    - fixed_wiring_points
    - timing_class_projection
    - rules
    - zero_point_operation_classes
    - zero_point_classification_width_bits
    - needs_input_conditions
  logic_rule_contract:
    rule_ids_globally_unique_within_profile: true
    each_match_has_exactly_one_width_range: true
    width_range_fields: [classification_width_bits, max_operand_width_bits]
    width_range_endpoints_type: positive_integer_not_boolean
    width_ranges_are_closed: true
    same_class_must_use_same_width_range_field: true
    same_class_closed_intervals_must_be_pairwise_disjoint: true
    shared_endpoint_counts_as_overlap: true
    overlap_or_ambiguous_match_semantics: semantic_malformed_profile_artifact
    overlap_or_ambiguity_may_be_substituted_with_needs_input: false
    points_type: nonnegative_integer_not_boolean
    operation_classes_type: unique_nonempty_substantive_string_list
  timing_class_projection_contract:
    type: nonempty_sequence
    record_exact_fields: [operation_classes, allowed_timing_classes]
    operation_classes_type: unique_nonempty_substantive_string_list
    allowed_timing_classes_type: unique_nonempty_enum_string_list
    timing_class_allowed_values: [wiring, non_arithmetic, arithmetic, mux, priority]
    classes_must_be_unique_across_records: true
    duplicate_or_ambiguous_class_projection_semantics: semantic_malformed_profile_artifact
    classes_must_exactly_cover_scored_union_zero_point_classes: true
    zero_point_classes_allowed_set_exact: [wiring]
    scored_classes_may_include_wiring: false
    fixed_builtin_class_projection:
      constant: [wiring]
      rename: [wiring]
      bit_slice: [wiring]
      concatenate: [wiring]
      static_cast: [wiring]
      fixed_shift: [wiring]
      boolean: [non_arithmetic]
      reduction: [non_arithmetic]
      compare: [non_arithmetic]
      mux: [mux, priority]
      add: [arithmetic]
      sub: [arithmetic]
      variable_shift: [arithmetic]
      mul: [arithmetic]
      div: [arithmetic]
      mod: [arithmetic]
      floating_point: [arithmetic]
      transcendental: [arithmetic]
    fixed_builtin_projection_applies_when_class_is_present: true
    fixed_builtin_allowed_timing_classes_match_mode: exact_set_equality_per_operation_class
    custom_may_override_fixed_builtin_class_projection: false
    custom_may_narrow_or_widen_fixed_builtin_allowed_set: false
    multiple_builtin_classes_may_share_a_record_only_when_their_fixed_sets_are_equal: true
    mux_to_priority_is_selection_refinement: true
    priority_refinement_requires_positive_fields: [mux_inputs, priority_entries]
    custom_only_class_requires_substantive_calibration_evidence: true
    custom_only_class_requires_library_or_macro_assumption: true
    custom_only_class_strict_calibration_support_contract_ref: custom_profile_contract.strict_calibration_support_contract
  strict_calibration_support_contract:
    trigger_sets:
      additional_port_models: set_difference(profile.memory_policy.generic_memory.allowed_port_models,[1RW,1R1W])
      custom_only_operation_classes: set_difference(union(profile.logic_complexity_points.timing_class_projection[].operation_classes),keys(custom_profile_contract.timing_class_projection_contract.fixed_builtin_class_projection))
    applies_when_either_trigger_set_is_nonempty: true
    no_trigger_means_structured_string_contract_not_required: true
    strict_field_rules_apply_to_exact_paths:
      - profile.calibration.evidence
      - profile.calibration.library_or_macro_assumptions
    required_subjects_definition:
      additional_port_model_item: "port:<exact-additional-port-model-id>"
      custom_only_operation_class_item: "operation:<exact-custom-only-operation-class>"
      required_set: union(all_additional_port_model_items,all_custom_only_operation_class_items)
      evidence_and_assumptions_subjects_must_each_exactly_equal_required_set: true
    placeholder_scan:
      normalization_steps_in_order:
        - unicode_nfkc
        - remove_all_unicode_general_category_Cf_codepoints
        - unicode_default_casefold
        - replace_each_maximal_run_of_non_L_or_N_unicode_categories_with_one_ascii_space
        - trim_and_collapse_ascii_spaces
      letter_or_number_definition: unicode_general_category_starts_with_L_or_N
      match_mode: contiguous_complete_normalized_tokens_anywhere
      reject_match_even_when_surrounded_by_negation_or_disclaimer: true
      banned_single_tokens:
        - generic
        - placeholder
        - template
        - dummy
        - example
        - sample
        - none
        - unknown
        - tbd
        - tbc
        - todo
        - fixme
        - pending
        - unspecified
        - undecided
        - blocked
        - unbounded
        - uncalibrated
      banned_token_sequences:
        - needs input
        - not applicable
        - n a
        - no calibration
        - without calibration
        - missing calibration
        - calibration unavailable
        - no characterization
        - without characterization
        - missing characterization
        - characterization unavailable
        - no evidence
        - without evidence
        - missing evidence
        - evidence unavailable
        - no macro
        - no macros
        - without macro
        - without macros
        - missing macro
        - missing macros
        - macro unavailable
        - macros unavailable
        - no library
        - no libraries
        - without library
        - without libraries
        - missing library
        - missing libraries
        - library unavailable
        - libraries unavailable
        - no assumption
        - no assumptions
        - without assumption
        - without assumptions
        - missing assumption
        - missing assumptions
        - assumption unavailable
        - assumptions unavailable
        - no pvt
        - without pvt
        - missing pvt
        - pvt unavailable
        - not calibrated
        - same as builtin
        - same as built in
        - same as default
        - use builtin
        - use built in
        - use default
        - to be determined
        - to be confirmed
        - not known
    structured_string_common_contract:
      clause_separator: ";"
      key_value_separator: "="
      split_each_clause_at_first_key_value_separator: true
      trim_unicode_whitespace_around_clauses_keys_and_values: true
      reject_empty_clause_key_or_value: true
      keys_are_case_sensitive_ascii_literals: true
      values_may_contain_clause_separator: false
      duplicate_keys_allowed: false
      unknown_keys_allowed: false
      key_order_significant: false
    subjects_value_contract:
      encoding: comma_delimited_subject_items
      trim_unicode_whitespace_around_items: true
      empty_items_allowed: false
      duplicate_items_allowed: false
      split_each_item_at_first_colon: true
      allowed_prefixes_exact: [port, operation]
      port_suffix_must_be_exact_additional_port_model: true
      port_suffix_canonical_id_regexes_ref: machine_field_contract.generic_port_model_contract.canonical_id_regexes
      operation_suffix_must_be_exact_custom_only_operation_class: true
      custom_only_operation_class_suffix_regex: '^[A-Za-z0-9][A-Za-z0-9._:/@+#-]{2,}$'
      comparison_mode: exact_case_sensitive_string
      item_set_must_exactly_equal_required_subjects: true
    stable_locator_contract:
      regex: '^[A-Za-z0-9][A-Za-z0-9._:/@+#-]{2,}$'
      minimum_codepoints_after_trim: 3
    pinned_revision_contract:
      regex: '^[A-Za-z0-9][A-Za-z0-9._+-]{1,}$'
      minimum_codepoints_after_trim: 2
      comparison_normalization: unicode_nfkc_then_unicode_default_casefold_then_trim
      forbidden_moving_aliases: [head, latest, current, main, master, trunk, tip, default]
    evidence_field_contract:
      exact_keys: [artifact, revision, subjects, timing_basis, area_basis]
      artifact_value_contract_ref: stable_locator_contract
      revision_value_contract_ref: pinned_revision_contract
      subjects_value_contract_ref: subjects_value_contract
      measurement_normalization: unicode_nfkc_then_unicode_default_casefold
      measurement_decimal_safety_ref: machine_field_contract.decimal_token_safety
      timing_basis_positive_measurement_regex: '(^|[^-+−0-9A-Za-z.])([-+−]?[0-9]+(?:\.[0-9]+)?)[ \t]*(ps|ns|mhz|ghz)($|[^0-9A-Za-z.])'
      area_basis_positive_measurement_regex: '(^|[^-+−0-9A-Za-z.])([-+−]?[0-9]+(?:\.[0-9]+)?)[ \t]*(um(?:\^?2)|μm(?:\^?2)|mm(?:\^?2)|cells?|gates?)($|[^0-9A-Za-z.])'
      unicode_minus_sign_is_parsed_as_ascii_minus_before_decimal_comparison: true
      matched_decimal_must_be_strictly_greater_than_zero: true
    library_or_macro_assumptions_field_contract:
      exact_keys: [provider, implementation, revision, subjects, timing_model, area_model]
      provider_minimum_codepoints_after_trim: 3
      provider_must_contain_unicode_letter_or_number: true
      implementation_value_contract_ref: stable_locator_contract
      revision_value_contract_ref: pinned_revision_contract
      subjects_value_contract_ref: subjects_value_contract
      timing_model_value_contract_ref: stable_locator_contract
      area_model_value_contract_ref: stable_locator_contract
  needs_input_conditions_contract:
    type: mapping
    exact_fields:
      - classification_width_bits_above
      - operation_classes
      - invalid_or_unknown_width
      - result
    classification_width_bits_above_type: positive_integer_not_boolean
    operation_classes_type: unique_nonempty_substantive_string_list
    invalid_or_unknown_width_type: boolean
    result_exact_value: NEEDS_INPUT
    require_disjoint_from_scored_classes: true
    require_disjoint_from_zero_point_classes: true
  zero_point_classification_width_bits_contract:
    type: mapping
    exact_fields: [min_inclusive, max_inclusive]
    min_inclusive_type: nonnegative_integer_not_boolean
    max_inclusive_type: nonnegative_integer_not_boolean
    require_min_lte_max: true
    require_max_lte_needs_input_classification_width_bits_above: true
    needs_input_width_predicate: strictly_greater_than
  known_fail_conditions_contract:
    type: unique_nonempty_string_list
    allowed_values:
      - port_model_outside_allowed_set
      - asynchronous_or_below_minimum_read_latency
      - concurrent_accesses_exceed_declared_or_profile_limits
      - undefined_or_incompatible_collision_semantics
      - same_cycle_dependent_secondary_lookup
    require_all_allowed_values: true
    allow_unknown_values: false
    any_evidenced_condition_causes: FAIL
    gate_routing_ref: machine_field_contract.fixed_memory_gate_routing
  memory_scope_contract:
    generic_memory.applies_to_storage_kinds: [sram, register]
    generic_memory.excluded_storage_kinds: [cam]
    cam.applies_to_storage_kinds: [cam]
    cam.is_generic_memory_exception: true
    cam.generic_async_read_prohibition_applies: false
  cam_contract:
    required_profile_thresholds_exact: [cam_parallel_entries, cam_compare_bits]
    fixed_semantics_ref: machine_field_contract.memory_policy_scope.fixed_cam_semantics
    fixed_metric_accounting_ref: metric_accounting.cam
    custom_metric_accounting_allowed: false
  unit_contracts:
    logic_complexity_points.unit: points
  required_non_signoff_fixed_values:
    fixed: true
    classification: organizational_heuristic
    threshold_authority: user_approved_policy
    physical_fact: false
    signoff_qualified: false
    replaces_sta: false
    replaces_physical_design: false
    requires_library_pvt_parasitic_signoff: true
  provenance_contract:
    exact_source_fields: [owner, document, revision, approval_basis]
    exact_calibration_fields:
      - method
      - evidence
      - pvt_assumptions
      - library_or_macro_assumptions
      - validated_on
    all_nine_fields_type: substantive_nonempty_string
    reserved_tokens_after_trim_and_unicode_casefold:
      - UNKNOWN
      - NONE
      - N/A
      - NA
      - TBD
      - TBC
      - TODO
      - FIXME
      - PENDING
      - UNSPECIFIED
      - UNDECIDED
      - NEEDS_INPUT
      - BLOCKED
      - UNBOUNDED
      - NOT_APPLICABLE
      - PLACEHOLDER
      - TEMPLATE
      - DUMMY
      - EXAMPLE
      - SAMPLE
    template_marker_regex_case_insensitive: '\{\{[\s\S]*?\}\}|<required[^>]*(?:>|\Z)'
    reject_reserved_or_template_marker_in_every_field: true
  content_identity_contract_ref: machine_field_contract.profile_content_identity
  integer_semantics_ref: machine_field_contract.integer_semantics
  fixed_global_semantics_refs:
    - selection_policy
    - decision_semantics
    - non_signoff
    - period_validation
    - period_bands
    - machine_field_contract.memory_policy_scope
    - machine_field_contract.fixed_memory_gate_routing
    - machine_field_contract.decimal_token_safety
    - machine_field_contract.profile_validation_outcomes
    - resource_accounting
    - metric_accounting
  on_any_contract_violation:
    semantic_classification: malformed_profile
    artifact_valid: false
    profile_resolution_must_stop: true
    verdict_status_emitted: false
    needs_input_substitution_allowed: false
    allow_valid_subsection_reuse: false
